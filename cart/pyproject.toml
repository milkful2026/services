[project]
name = "cart"
version = "0.1.0"
description = "Milkful Cart Service — DynamoDB-backed cart line items, Idempotency-Key writes, optimistic concurrency (MA-96)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]
