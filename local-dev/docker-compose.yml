services:
  moto:
    # Single moto_server process emulates Cognito, DynamoDB, SQS, and
    # EventBridge all on one port — boto3 requests carry enough info
    # (X-Amz-Target / action) for moto to route internally, so every
    # service points AWS_ENDPOINT_URL at this one container.
    image: motoserver/moto:latest
    ports:
      - "5000:5000"
    environment:
      MOTO_PORT: "5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 2s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: milkful
      POSTGRES_PASSWORD: milkful
      POSTGRES_DB: postgres
    volumes:
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - milkful-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milkful"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # One-shot provisioning step — the containerized equivalent of running
  # bootstrap.py / apply_migrations.py / seed_*.py by hand. Runs once
  # moto+postgres are healthy, writes each service's .env.local into a
  # shared docker volume (not a host bind-mount — see Dockerfile.bootstrap
  # and bootstrap.py's LOCAL_DEV_ENV_OUTPUT_ROOT for why), then exits.
  # moto's in-memory state (and this provisioning) only lasts as long as
  # the containers do — `docker compose down` (not just `stop`) wipes it,
  # and the next `up` re-runs this from scratch.
  bootstrap:
    build:
      context: ..
      dockerfile: local-dev/Dockerfile.bootstrap
    depends_on:
      moto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      LOCAL_DEV_AWS_ENDPOINT_URL: http://moto:5000
      LOCAL_DEV_DB_HOST: postgres
      LOCAL_DEV_REDIS_HOST: redis
      LOCAL_DEV_INVENTORY_HTTP_URL: http://inventory:8000
      # Container-network hostnames — bootstrap.py's own defaults are
      # host-side "localhost:PORT" (correct for a native/non-Docker run),
      # which inside this container would mean "this container", not the
      # catalog/user/pricing-offer/wallet containers. Needed for the
      # CART_*/ORDER_* base URLs bootstrap.py writes into cart/order's
      # generated .env.local (subscription/order/wallet's own request-time
      # calls, not bootstrap's).
      LOCAL_DEV_CATALOG_HTTP_URL: http://catalog:8003
      LOCAL_DEV_USER_HTTP_URL: http://user:8002
      LOCAL_DEV_PRICING_HTTP_URL: http://pricing-offer:8005
      LOCAL_DEV_WALLET_HTTP_URL: http://wallet:8006
      # MA-34 checkout: Order Service calls Cart's and Subscription's
      # internal routes.
      LOCAL_DEV_CART_HTTP_URL: http://cart:8004
      LOCAL_DEV_SUBSCRIPTION_HTTP_URL: http://subscription:8008
      LOCAL_DEV_ENV_OUTPUT_ROOT: /shared
    volumes:
      - identity-auth-env:/shared/identity-auth
      - user-env:/shared/user
      - inventory-env:/shared/inventory
      - catalog-env:/shared/catalog
      - subscription-env:/shared/subscription
      - order-env:/shared/order
      - cart-env:/shared/cart
      - wallet-env:/shared/wallet
      - payment-env:/shared/payment

  identity-auth:
    build:
      context: ..
      dockerfile: identity-auth/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/identity-auth/.env.local
    volumes:
      - identity-auth-env:/shared/identity-auth

  user:
    build:
      context: ..
      dockerfile: user/Dockerfile
    image: milkful-user:local
    ports:
      - "8002:8002"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/user/.env.local
    volumes:
      - user-env:/shared/user

  # Drains user's outbox (UserRegistered) to EventBridge — same image as
  # `user`, different CMD. Without it, UserRegistered never left the
  # outbox table, so Wallet never auto-provisioned a wallet for a newly
  # registered user and /wallet/me sat at CREATING forever.
  user-outbox:
    build:
      context: ..
      dockerfile: user/Dockerfile
    image: milkful-user:local
    command: ["python", "run_local_outbox_publisher.py"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/user/.env.local
    volumes:
      - user-env:/shared/user

  inventory:
    build:
      context: ..
      dockerfile: inventory/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/inventory/.env.local
    volumes:
      - inventory-env:/shared/inventory

  catalog:
    build:
      context: ..
      dockerfile: catalog/Dockerfile
    ports:
      - "8003:8003"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/catalog/.env.local
    volumes:
      - catalog-env:/shared/catalog

  subscription:
    build:
      context: ..
      dockerfile: subscription/Dockerfile
    image: milkful-subscription:local
    ports:
      - "8008:8008"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      catalog:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/subscription/.env.local
    volumes:
      - subscription-env:/shared/subscription

  # Drains subscription's outbox (SubscriptionOrderDue) to EventBridge —
  # same image as `subscription`, different CMD. Stands in for a real
  # rate(N) EventBridge Scheduler-triggered task (MA-131 §6/§11), same
  # role user/cart/wallet/payment's outbox scripts already play locally.
  # `image:` matches `subscription`'s own tag so compose builds this
  # identical Dockerfile once, not twice.
  subscription-outbox:
    build:
      context: ..
      dockerfile: subscription/Dockerfile
    image: milkful-subscription:local
    command: ["python", "-m", "handlers.outbox_publisher"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/subscription/.env.local
    volumes:
      - subscription-env:/shared/subscription

  order:
    build:
      context: ..
      dockerfile: order/Dockerfile
    image: milkful-order:local
    ports:
      - "8009:8009"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      user:
        condition: service_started
      wallet:
        condition: service_started
      pricing-offer:
        condition: service_started
      # MA-34 checkout (MA-136): cart read/clear + subscription create.
      cart:
        condition: service_started
      subscription:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/order/.env.local
    volumes:
      - order-env:/shared/order

  # Drains order's outbox (OrderConfirmed/OrderPaymentFailed) to
  # EventBridge — same image as `order`, different CMD. `image:` matches
  # `order`'s own tag so compose builds this identical Dockerfile once.
  order-outbox:
    build:
      context: ..
      dockerfile: order/Dockerfile
    image: milkful-order:local
    command: ["python", "-m", "handlers.outbox_publisher"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/order/.env.local
    volumes:
      - order-env:/shared/order

  # --- Pre-existing MA-24 compose gap, closed here (own commit — see
  # git log): cart/payment/wallet/pricing-offer had .env.local generation
  # (bootstrap.py) and real Dockerfiles (payment/wallet) or a working
  # native run_local.py (cart) for a while, but no docker-compose entry,
  # so Option A's "one command brings up the whole stack" never actually
  # included them. cart additionally needed its own new Dockerfile (none
  # existed before this commit) plus an ENV_LOCAL_PATH fix to
  # run_local.py/run_local_outbox_publisher.py, mirroring the fix
  # user/run_local.py already had — see those files' own comments. ---

  cart:
    build:
      context: ..
      dockerfile: cart/Dockerfile
    image: milkful-cart:local
    ports:
      - "8004:8004"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      catalog:
        condition: service_started
      user:
        condition: service_started
      pricing-offer:
        condition: service_started
      # MA-135: the subscription wallet gate reads Wallet's balance.
      wallet:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/cart/.env.local
    volumes:
      - cart-env:/shared/cart

  # Same image as `cart`, different CMD — `image:` matches `cart`'s own
  # tag so compose builds this identical Dockerfile once.
  cart-outbox:
    build:
      context: ..
      dockerfile: cart/Dockerfile
    image: milkful-cart:local
    command: ["python", "run_local_outbox_publisher.py"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/cart/.env.local
    volumes:
      - cart-env:/shared/cart

  wallet:
    build:
      context: ..
      dockerfile: wallet/Dockerfile
    image: milkful-wallet:local
    ports:
      - "8006:8006"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/wallet/.env.local
    volumes:
      - wallet-env:/shared/wallet

  # Drains wallet's outbox (WalletCreated/WalletCredited/WalletDebited/
  # WalletLowBalance) to EventBridge — same image as `wallet`, different
  # CMD. Nightly invariant-check sweep (invariant_check_handler.py) is
  # deliberately NOT containerized here: it's a run-once cron-shaped job,
  # not a long-running loop like this one, so it stays a documented
  # by-hand step (see README) rather than a `restart: always` container
  # that would just busy-loop re-running a "run once nightly" script.
  wallet-outbox:
    build:
      context: ..
      dockerfile: wallet/Dockerfile
    image: milkful-wallet:local
    command: ["python", "-m", "handlers.outbox_publisher"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/wallet/.env.local
    volumes:
      - wallet-env:/shared/wallet

  payment:
    build:
      context: ..
      dockerfile: payment/Dockerfile
    image: milkful-payment:local
    ports:
      - "8007:8007"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      wallet:
        condition: service_started
    environment:
      ENV_LOCAL_PATH: /shared/payment/.env.local
      # rzp_test_* credentials from the gitignored local-dev/.env (compose
      # reads it automatically for substitution; see .env.example). Real
      # env vars win over the bootstrap-generated .env.local, so these
      # reach Settings. Empty when unset — recharges then fail at
      # orders.create, same as before.
      PAYMENT_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      PAYMENT_RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      PAYMENT_RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - payment-env:/shared/payment

  # Drains payment's outbox (PaymentConfirmed/PaymentFailed) to
  # EventBridge — same image as `payment`, different CMD. The
  # reconciliation sweep is NOT a separate container: it already runs
  # in-process as a background thread inside `payment`'s own `main.py`
  # (see that file) — nothing else to containerize for it.
  payment-outbox:
    build:
      context: ..
      dockerfile: payment/Dockerfile
    image: milkful-payment:local
    command: ["python", "-m", "handlers.outbox_publisher"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      ENV_LOCAL_PATH: /shared/payment/.env.local
    volumes:
      - payment-env:/shared/payment

  # No DB, no AWS, no bootstrap-generated .env.local at all (see
  # pricing-offer/src/config/env.py's own docstring) — every value here
  # has a real default already; CORS is the one thing that must be set
  # explicitly for a browser-based (Flutter web) caller, same as the
  # native "Option B" instructions below.
  pricing-offer:
    build:
      context: ..
      dockerfile: pricing-offer/Dockerfile
    ports:
      - "8005:8005"
    depends_on:
      catalog:
        condition: service_started
    environment:
      PRICING_CATALOG_BASE_URL: http://catalog:8003
      PRICING_CORS_ALLOW_ALL: "true"

volumes:
  milkful-postgres-data:
  identity-auth-env:
  user-env:
  inventory-env:
  catalog-env:
  subscription-env:
  order-env:
  cart-env:
  wallet-env:
  payment-env:
