[project]
name = "payment"
version = "0.1.0"
description = "Milkful Payment Service — Razorpay wallet-recharge slice: gateway orders, authoritative webhook confirmation, idempotent recharge lifecycle (MA-99 / MA-24 MA-126)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" for this service's own modules; ".." (services/) so
# `from shared.events import load_schema` resolves the cross-service
# event-schema package at services/shared/events/.
pythonpath = ["src", ".."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` / `Query(...)` in parameter defaults is the
# framework's required idiom, not a bug (same pattern across catalog/inventory/wallet).
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]
